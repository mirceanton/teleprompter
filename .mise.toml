[tools]
# =================================================================================================
# Project Tools
# =================================================================================================
go = "1.27.3"
golangci-lint = "2.15.0"
"github:goreleaser/goreleaser" = "v2.19.0"

# =================================================================================================
# CI Tools
# =================================================================================================
"aqua:rhysd/actionlint" = "1"
"shellcheck" = "0.11"
"ubi:caarlos0/svu" = "latest"

[settings]
# Hold back freshly published tool releases (supply-chain protection).
minimum_release_age = "3d"
